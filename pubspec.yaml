name: almus_ai
description: ALMUS AI - a personal AI assistant (Phase 6, optional on-device face recognition pipeline with privacy controls).
publish_to: 'none'
version: 0.14.0+14

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  path: ^1.9.0
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  # Phase 6: speech-to-text and text-to-speech (Android system engines).
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  # Phase 7: Android biometric prompt (fingerprint / face / device PIN).
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  google_mlkit_face_detection: ^0.13.1
  path_provider: ^2.1.5
  # Phase 2: backup / restore.
  archive: ^3.6.1
  crypto: ^3.0.3
  cryptography: ^2.7.0
  file_picker: ^8.1.6
  # Phase 6 (face): in-app front camera stills, Keystore-backed key storage,
  # the optional scanning sound, and image decoding. No model/inference
  # runtime is bundled (see docs/FACE_MODEL_LICENSING.md).
  camera: ^0.11.0
  flutter_secure_storage: ^9.2.2
  audioplayers: ^6.1.0
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  # Phase 5: one tiny optional tuning file for the avatar (the avatar itself
  # is drawn in code and works even if this file is missing).
  assets:
    - assets/avatar/avatar_profile.json
    # Phase 6: original synthesized scanning loop (see assets/audio/README.md).
    - assets/audio/scan_loop.wav
