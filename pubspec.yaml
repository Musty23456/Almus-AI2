name: almus_ai
description: ALMUS AI - a personal AI assistant (Phase 5, humanoid avatar).
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  path: ^1.9.0
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  # Phase 5: one tiny optional tuning file for the avatar (the avatar itself
  # is drawn in code and works even if this file is missing).
  assets:
    - assets/avatar/avatar_profile.json
