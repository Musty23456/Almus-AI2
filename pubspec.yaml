name: almus_ai
description: ALMUS AI - a personal AI assistant (Phase 4, multi-provider AI orchestration and fallback).
publish_to: 'none'
version: 0.12.0+12

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  path: ^1.9.0
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  # Phase 6: speech-to-text and text-to-speech (Android system engines).
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  # Phase 7: Android biometric prompt (fingerprint / face / device PIN).
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  google_mlkit_face_detection: ^0.13.1
  path_provider: ^2.1.5
  # Phase 2: backup / restore.
  archive: ^3.6.1
  crypto: ^3.0.3
  cryptography: ^2.7.0
  file_picker: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  # Phase 5: one tiny optional tuning file for the avatar (the avatar itself
  # is drawn in code and works even if this file is missing).
  assets:
    - assets/avatar/avatar_profile.json
