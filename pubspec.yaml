name: almus_ai
description: ALMUS AI - a personal AI assistant (Phase 1, demo mode).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Phase 1 needs no bundled assets: the robot avatar is drawn in code.
  # To add images/animations later, create the files and declare them here:
  # assets:
  #   - assets/images/
  #   - assets/animations/
