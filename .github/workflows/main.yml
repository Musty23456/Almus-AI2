name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backend syntax check and tests (no dependencies to install)
        working-directory: Backend
        run: |
          for f in *.js; do node --check "$f"; done
          npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f pubspec.yaml && test -f lib/main.dart || { echo "Project files missing"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates android/ and applies the manifest/Kotlin patches. Same script
      # you can run locally: bash tool/bootstrap_android.sh
      - name: Generate and patch Android files
        run: bash tool/bootstrap_android.sh

      - name: Test Android patch scripts
        run: python3 -m unittest discover -s tool -p "test_*.py"

      # Database tests run on the CI machine through sqflite_common_ffi, which needs the SQLite library.
      - name: Install SQLite library for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: almus-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
