name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f pubspec.yaml && test -f lib/main.dart || { echo "Project files missing"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android files
        run: |
          if [ ! -d android ]; then
            cp pubspec.yaml /tmp/pubspec.yaml.bak
            cp -r test /tmp/test.bak
            flutter create --platforms=android --org com.almus --project-name almus_ai --no-pub .
            cp /tmp/pubspec.yaml.bak pubspec.yaml
            rm -rf test
            cp -r /tmp/test.bak test
          fi
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="ALMUS AI"/' "$MANIFEST"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          fi
          # Phase 6: microphone permission + speech/TTS service queries (idempotent).
          python3 tool/patch_android_manifest.py "$MANIFEST"
          # Phase 7: USE_BIOMETRIC, FlutterFragmentActivity, FLAG_SECURE channel, AppCompat theme (idempotent).
          python3 tool/patch_android_biometric.py
          grep -n 'android:label\|INTERNET\|RECORD_AUDIO\|USE_BIOMETRIC\|RecognitionService\|TTS_SERVICE' "$MANIFEST"

      # Database tests run on the CI machine through sqflite_common_ffi, which needs the SQLite library.
      - name: Install SQLite library for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: almus-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
