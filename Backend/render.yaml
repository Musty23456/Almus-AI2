# Optional Render Blueprint. You can also create the service by hand (see README).
services:
  - type: web
    name: almus-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      # Optional extra providers (see docs/PROVIDERS.md). Leave unset to stay Gemini-only.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GROQ_COST_POLICY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: APP_ACCESS_TOKEN
        sync: false
      # Optional cloud face verification (Phase 6b). Leave unset to keep it off.
      - key: LUXAND_API_TOKEN
        sync: false
      - key: LUXAND_MIN_SIMILARITY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: TRUST_PROXY
        value: "true"
